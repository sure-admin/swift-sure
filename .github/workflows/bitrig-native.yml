name: Bitrig Native

on:
  pull_request:
    paths:
      - "App/**"
      - "Shared/**"
      - "Tests/**"
      - "Docs/SpendingComparison.md"
      - "Watch/**"
      - "Project.json"
      - "Docs/AssistantTools.json"
      - "Docs/SureContractBaseline.md"
      - ".github/scripts/**"
      - ".github/workflows/bitrig-native.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

concurrency:
  group: bitrig-native-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Check assistant tool mirror
        run: python3 .github/scripts/sync_assistant_tools.py --check

      - name: Test CI scripts
        run: ruby .github/scripts/next_testflight_build_number_test.rb

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec Project.json

      - name: Test
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | first | .udid')"
          test -n "$simulator_id"
          xcodebuild \
            -project Sure.xcodeproj \
            -scheme Sure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "${{ runner.temp }}/DerivedData-tests" \
            CODE_SIGNING_ALLOWED=NO \
            test

  mac-test:
    name: Mac unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec Project.json

      - name: Test
        run: >-
          xcodebuild
          -project Sure.xcodeproj
          -scheme Sure
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "${{ runner.temp }}/DerivedData-mac-tests"
          CODE_SIGNING_ALLOWED=NO
          'TEST_HOST=$(BUILT_PRODUCTS_DIR)/Sure.app/Contents/MacOS/Sure'
          test

  watch-test:
    name: Watch unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec Project.json

      - name: Test Watch state
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("watchOS")) | .value[]] | first | .udid')"
          phone_simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | first | .udid')"
          test -n "$simulator_id"
          test -n "$phone_simulator_id"
          pair_id="$(xcrun simctl list pairs -j | jq -r --arg watch "$simulator_id" '[.pairs | to_entries[] | select(.value.watch.udid == $watch)] | first | .key // empty')"
          if [ -z "$pair_id" ]; then
            xcrun simctl pair "$simulator_id" "$phone_simulator_id"
          fi
          xcodebuild \
            -project Sure.xcodeproj \
            -scheme "Sure Watch" \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$simulator_id" \
            -derivedDataPath "${{ runner.temp }}/DerivedData-watch-tests" \
            CODE_SIGNING_ALLOWED=NO \
            test

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone and iPad
            scheme: Sure
            destination: generic/platform=iOS Simulator
          - name: Mac
            scheme: Sure
            destination: platform=macOS
          - name: Apple Watch
            scheme: Sure Watch
            destination: generic/platform=watchOS Simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec Project.json

      - name: Build
        run: >-
          xcodebuild
          -project Sure.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -configuration Debug
          -destination "${{ matrix.destination }}"
          -derivedDataPath "${{ runner.temp }}/DerivedData-${{ strategy.job-index }}"
          CODE_SIGNING_ALLOWED=NO
          build

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - mac-test
      - watch-test
      - build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Check deployment credentials
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for name in \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec Project.json

      - name: Install signing credentials
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          auth_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$auth_key_path"
          chmod 600 "$auth_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Determine next TestFlight build number
        env:
          APP_BUNDLE_ID: am.sure.insights
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          BUILD_NUMBER_OFFSET: ${{ github.run_number }}
        run: |
          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          build_number="$(APP_MARKETING_VERSION="$marketing_version" ruby .github/scripts/next_testflight_build_number.rb)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Using TestFlight build number $build_number for version $marketing_version."

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Watch/Info.plist

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          xcodebuild \
            -project Sure.xcodeproj \
            -scheme Sure \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sure.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-testflight" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive

      - name: Upload archive to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :destination string upload" "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$export_options_path"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Sure.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$export_options_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
